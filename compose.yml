name: ironmind

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ironmind
      POSTGRES_USER: ironmind
      # The fallback is for a database reachable only from this computer.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ironmind-local}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/18.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ironmind -d ironmind']
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=ironmind;Username=ironmind;Password=${POSTGRES_PASSWORD:-ironmind-local}
      DataProtection__KeyDirectory: /app/keys
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:8080'
    volumes:
      - gym-keys:/app/keys

volumes:
  db-data:
  gym-keys:
