name: Build and test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet build --configuration Release --no-restore --warnaserror
      - run: dotnet test --configuration Release --no-build --collect "XPlat Code Coverage" --results-directory TestResults
      - name: Require 80% line and branch coverage
        shell: python
        run: |
          import glob, sys, xml.etree.ElementTree as ET
          report = ET.parse(glob.glob("TestResults/**/coverage.cobertura.xml", recursive=True)[0]).getroot()
          lines, branches = float(report.get("line-rate")), float(report.get("branch-rate"))
          print(f"Lines {lines:.1%}, branches {branches:.1%}")
          sys.exit(lines < 0.8 or branches < 0.8)
      - run: dotnet tool restore
      - run: dotnet ef migrations has-pending-model-changes --project IronMindGym --configuration Release --no-build
      - run: dotnet list package --vulnerable --include-transitive
      - uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: TestResults/**/coverage.cobertura.xml

  client:
    name: Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build
      - run: npm audit --audit-level=high

  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [api, client]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag ironmind:ci .
